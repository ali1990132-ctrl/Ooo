plugins {
    id 'com.android.application'
}

android {
    namespace 'com.rihla.trainer'
    compileSdk 34

    defaultConfig {
        applicationId 'com.rihla.trainer'
        minSdk 21
        targetSdk 34
        versionCode 3
        versionName '1.2'
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
