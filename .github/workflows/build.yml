name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/*.apk out/RihlatAlMudarriba.apk

      - uses: actions/upload-artifact@v4
        with:
          name: RihlatAlMudarriba-APK
          path: out/RihlatAlMudarriba.apk

      - name: Publish direct download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: رحلة المدربة
          make_latest: true
          files: out/RihlatAlMudarriba.apk
